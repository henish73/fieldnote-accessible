<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fieldnote – Accessible search</title>
<style>
/* VOICE: calm campus utility; plain words, nothing hidden behind hover.
   IDEA: a well-labelled campus noticeboard you can walk with the Tab key.
   PICTURE: the results list itself, with labelled map pins where maps appear.
   COLOUR and TYPE: pale yellow paper, chestnut ink for actions, espresso text, a gold focus halo; system sans, 16px body.
   LAYOUT: search bar, visible type and filter controls, results with a side panel; stacks under 900px. */
:root{color-scheme:light;
  --bg:light-dark(#fbf3d5,#1c1310);--surface:light-dark(#fffbea,#2a1c16);--ink:light-dark(#2b1a12,#f7eed8);
  --muted:light-dark(#5e4636,#d8c4a5);--line:light-dark(#d9c79a,#5a4234);--ctl:light-dark(#8f6e4f,#a68a6e);--link:light-dark(#8a3a2b,#f2b49a);
  --brand:light-dark(#8a3a2b,#9c4532);--on-brand:#fff;--focus:light-dark(#2b1a12,#ffd84d);--halo:light-dark(#f2c94c,transparent);
  --free-bg:light-dark(#e2efd2,#22351b);--free-ink:light-dark(#2d5a17,#c6e6ae);
  --paid-bg:light-dark(#f7ddc9,#4a2a1a);--paid-ink:light-dark(#6b2610,#ffcfb2);
  --ended-bg:light-dark(#ece3cf,#3a2e26);--ended-ink:light-dark(#4a3a2c,#e2d6c4);
  --sel:light-dark(#f6e3c6,#4a2d22)}
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 7px var(--halo);border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--surface);color:var(--link);padding:10px 16px;border:2px solid var(--focus);border-radius:6px;z-index:10;font-weight:600}
.skip:focus{top:10px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding-block:16px}
.brand{display:inline-flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-.04em;color:var(--ink);background:none;border:0;cursor:pointer;min-height:44px;padding:0 4px;font-family:inherit}
.mark{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.mark::before{content:"";width:13px;height:13px;border:3px solid #f2c94c;transform:rotate(45deg);border-radius:3px}
form.search{flex:1 1 420px;position:relative}
form.search label{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
.box{display:flex;gap:8px}
.field{flex:1;position:relative;display:flex}
#query{flex:1;height:48px;font:inherit;font-size:17px;padding:0 44px 0 14px;border:2px solid var(--ctl);border-radius:8px;background:var(--surface);color:var(--ink)}
#query::-webkit-search-cancel-button{display:none}
#clear{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;border-radius:6px}
button{font:inherit;color:inherit}
.btn{min-height:48px;padding:0 20px;border-radius:8px;border:2px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:700;cursor:pointer}
.btn.quiet{background:var(--surface);color:var(--link)}
#suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);list-style:none;margin:0;padding:6px;background:var(--surface);border:2px solid var(--line);border-radius:8px;z-index:5;box-shadow:0 8px 24px #3a1d0e33}
#suggest li{padding:10px 12px;border-radius:6px;cursor:pointer}
#suggest li[aria-selected=true]{background:var(--sel);outline:2px solid var(--link)}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
main{padding-block:24px 48px}
main:focus{outline:none}
h1{font-size:clamp(26px,3.4vw,34px);line-height:1.15;margin:0 0 6px;letter-spacing:-.02em;text-wrap:balance}
h1:focus-visible{outline-offset:6px}
.controls{display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-end;margin:14px 0 8px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.controls h2,.controls legend{font-size:14px;font-weight:700;margin:0 0 6px;padding:0;color:var(--muted)}
fieldset{border:0;margin:0;padding:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 16px;border:2px solid var(--ctl);border-radius:999px;background:var(--surface);cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.seg button[aria-pressed=true]::before{content:"✓ "}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:2px solid var(--ctl);border-radius:999px;cursor:pointer;font-weight:600}
.radios input{width:18px;height:18px;margin:0;accent-color:var(--brand)}
.radios label:has(input:checked){border-color:var(--brand);background:var(--sel)}
.summary{margin:6px 0 16px;color:var(--muted)}
.summary strong{color:var(--ink)}
.linkbtn{background:none;border:0;padding:0 4px;min-height:44px;color:var(--link);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
ol.results{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
ol.results>li{padding:16px 20px;border-bottom:1px solid var(--line)}
ol.results>li:last-child{border-bottom:0}
.source{font-size:14px;color:var(--muted);margin:0}
.results h2{margin:2px 0 4px;font-size:20px;line-height:1.3}
.title{background:none;border:0;padding:2px 0;text-align:left;color:var(--link);font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;min-height:44px}
.desc{margin:0 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px;border:1.5px solid currentColor}
.badge.free{background:var(--free-bg);color:var(--free-ink)}
.badge.paid{background:var(--paid-bg);color:var(--paid-ink);border-style:dashed}
.badge.ended{background:var(--ended-bg);color:var(--ended-ink)}
.badge.type{background:transparent;color:var(--muted)}
nav.pages{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
nav.pages button{min-width:44px;min-height:44px;border:2px solid var(--ctl);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600}
nav.pages button[aria-current=page]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
aside{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.card h2{font-size:18px;margin:0 0 8px}
.card ul{list-style:none;margin:0;padding:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 24px;max-width:820px}
.panel ul.try{padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:8px 0 0}
.chips button{min-height:44px;padding:0 16px;border:2px solid var(--link);border-radius:999px;background:var(--surface);color:var(--link);font-weight:600;cursor:pointer}
.kicker{font-size:14px;font-weight:700;color:var(--muted);margin:0 0 4px}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:12px 0}
.facts dt{font-weight:700}.facts dd{margin:0}
.map{position:relative;height:240px;border-radius:8px;overflow:hidden;border:1px solid var(--line);
  background:repeating-linear-gradient(24deg,#e3ead9 0 34px,#e9efe2 34px 73px,#dfe7d8 73px 105px)}
.card .map{height:170px}
.road{position:absolute;width:125%;height:17px;background:#fafaf4;border:1px solid #cfd7c8}
.r1{left:-12%;top:28%;transform:rotate(-13deg)}.r2{left:-8%;top:62%;transform:rotate(10deg)}.r3{left:-12%;top:46%;transform:rotate(-66deg)}
.area{position:absolute;font-size:12px;font-weight:700;color:#2f4a2c;background:#ffffffcc;padding:1px 6px;border-radius:4px}
.a1{left:10px;top:8px}.a2{left:10px;bottom:8px}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px}
.shape{width:30px;height:30px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;border:3px solid #fff;box-shadow:0 1px 4px #0006}
.s0{border-radius:50%}.s1{border-radius:4px}.s2{transform:rotate(45deg);border-radius:3px}.s2 span{transform:rotate(-45deg)}.s3{border-radius:50% 50% 4px 4px}
.pin .tag{background:#fff;color:#172033;font-size:13px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid #9aa5b8;white-space:nowrap}
ol.places{padding:0;list-style:none;display:grid;gap:8px}
ol.places li{display:flex;gap:10px;align-items:center}
ol.places .shape{flex:none;width:26px;height:26px;font-size:13px;border-width:2px;box-shadow:none}
footer{border-top:1px solid var(--line);padding:18px 0 28px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip">Skip to results</a>
<header>
  <div class="wrap head">
    <button class="brand" id="brand" type="button" aria-label="Fieldnote home"><span class="mark" aria-hidden="true"></span>fieldnote.</button>
    <form class="search" id="search-form" role="search" novalidate>
      <label for="query">Search the campus index</label>
      <div class="box">
        <div class="field">
          <input id="query" type="search" maxlength="120" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest" aria-describedby="query-hint">
          <button type="button" id="clear" aria-label="Clear search text" hidden>×</button>
          <ul id="suggest" role="listbox" aria-label="Suggested searches" hidden></ul>
        </div>
        <button class="btn" type="submit">Search</button>
      </div>
      <p class="hint" id="query-hint">Press Enter to search. Use the Down arrow key for suggestions.</p>
    </form>
  </div>
</header>
<main id="main" class="wrap" tabindex="-1"></main>
<p id="status" class="sr-only" role="status" aria-live="polite"></p>
<footer><div class="wrap">Fieldnote Search · Fictional campus index · All entries are sample data · Accessible redesign prototype</div></footer>

{

const categoryNames = ["All", "Maps", "Events", "Guides"];
const filterNames = { all: "Any result", free: "Free only", campus: "On campus" };
const suggestions = ["campus bike repair", "bike repair workshop", "bike parking", "bike rental", "library study rooms", "library hours",
  "student bus pass", "bus stops", "dining hall hours", "food bank", "flu shot", "gym hours", "lost student card", "career fair"];
const relatedByTopic = [
  { test: /bike|bicycle|cycling/i, terms: ["bike repair workshop", "bike parking", "campus bike repair", "bike rental"] },
  { test: /library|study|print|laptop/i, terms: ["library study rooms", "library hours", "laptop loan"] },
  { test: /bus|transit|shuttle|parking/i, terms: ["student bus pass", "bus stops", "night shuttle"] },
  { test: /food|dining|meal|cook/i, terms: ["dining hall hours", "food bank", "cooking class"] },
  { test: /health|flu|gym|yoga/i, terms: ["flu shot", "gym hours", "student health"] },
];
const defaultRelated = ["campus bike repair", "library study rooms", "student bus pass"];
const defaultQuery = "campus bike repair";


const SHAPES = ["circle", "square", "diamond", "arch"];
const pageSize = 5;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const main = $("main"), queryField = $("query"), suggestBox = $("suggest"), clearBtn = $("clear"), statusEl = $("status");

let state = { view: "results", query: "campus bike repair", category: "All", filter: "all", page: 1, item: "" };

function rank(query) {
  const words = (query.toLowerCase().match(/[\p{L}\p{N}]+/gu) || []).filter(w => w.length > 1);
  if (!words.length) return [];
  const out = [];
  for (const entry of entries) {
    const hay = [entry.title, entry.snippet, entry.keywords, entry.source].join(" ").toLowerCase();
    const matched = words.filter(w => hay.includes(w));
    if (matched.length < Math.ceil(words.length * 0.67)) continue;
    const exact = entry.title.toLowerCase().includes(query.toLowerCase()) ? 12 : 0;
    const titleHits = matched.filter(w => entry.title.toLowerCase().includes(w)).length;
    out.push({ entry, score: exact + matched.length * 4 + titleHits * 2 });
  }
  return out.sort((a, b) => b.score - a.score).map(m => m.entry);
}
const isEnded = e => /Ended/.test(e.metadata);
function filtered() {
  return rank(state.query).filter(e =>
    (state.category === "All" || e.type === state.category) &&
    (state.filter === "all" || (state.filter === "free" && e.free) || (state.filter === "campus" && e.campus)));
}
const relatedFor = q => { const t = relatedByTopic.find(g => g.test.test(q)); return (t ? t.terms : defaultRelated).filter(x => x !== q.toLowerCase()); };

/* ---------- navigation: every change of view sets where focus goes ---------- */
function go(changes, focusId, message) {
  Object.assign(state, changes);
  render();
  const target = (focusId && $(focusId)) || $("view-title");
  if (target) target.focus();
  announce((typeof message === "function" ? message() : message) || $("view-title").textContent);
}
function announce(text) { statusEl.textContent = ""; setTimeout(() => { statusEl.textContent = text; }, 60); }
function runSearch(term) {
  const q = term.trim();
  closeSuggest();
  if (!q) { go({ view: "home" }); return; }
  queryField.value = q; syncClear();
  go({ view: "results", query: q, category: "All", filter: "all", page: 1, item: "" });
}

/* ---------- search box, suggestions (combobox pattern) ---------- */
let active = -1, options = [];
function openSuggest() {
  const term = queryField.value.trim().toLowerCase();
  options = term ? suggestions.filter(o => o.includes(term) && o !== term).slice(0, 6) : [];
  active = -1;
  suggestBox.innerHTML = options.map((o, i) => `<li role="option" id="opt-${i}" aria-selected="false">${esc(o)}</li>`).join("");
  suggestBox.hidden = !options.length;
  queryField.setAttribute("aria-expanded", String(!!options.length));
  queryField.removeAttribute("aria-activedescendant");
}
function closeSuggest() { suggestBox.hidden = true; queryField.setAttribute("aria-expanded", "false"); queryField.removeAttribute("aria-activedescendant"); active = -1; }
function highlight(i) {
  active = i;
  [...suggestBox.children].forEach((li, n) => li.setAttribute("aria-selected", String(n === i)));
  if (i >= 0) { queryField.setAttribute("aria-activedescendant", "opt-" + i); queryField.value = options[i]; }
}
const syncClear = () => { clearBtn.hidden = !queryField.value; };
queryField.addEventListener("input", () => { openSuggest(); syncClear(); });
queryField.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { if (suggestBox.hidden) openSuggest(); if (options.length) { e.preventDefault(); highlight((active + 1) % options.length); } }
  else if (e.key === "ArrowUp" && options.length && !suggestBox.hidden) { e.preventDefault(); highlight(active <= 0 ? options.length - 1 : active - 1); }
  else if (e.key === "Escape") { if (!suggestBox.hidden) { e.preventDefault(); closeSuggest(); } }
  /* Enter is handled here directly, so it works even where form submission is blocked (e.g. sandboxed previews) */
  else if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); runSearch(queryField.value); }
});
suggestBox.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); runSearch(li.textContent); } });
$("search-form").addEventListener("submit", e => { e.preventDefault(); runSearch(queryField.value); });
document.querySelector("#search-form .btn").addEventListener("click", e => { e.preventDefault(); runSearch(queryField.value); });
clearBtn.addEventListener("click", () => { queryField.value = ""; syncClear(); closeSuggest(); queryField.focus(); announce("Search text cleared"); });
queryField.addEventListener("blur", () => setTimeout(closeSuggest, 120));
$("brand").addEventListener("click", () => go({ view: "home" }));
$("skip").addEventListener("click", e => { e.preventDefault(); ($("view-title") || main).focus(); });

/* ---------- pieces ---------- */
function badges(e) {
  const b = [`<span class="badge type">${esc(e.type.replace(/s$/, ""))}</span>`];
  if (e.type === "Events") b.push(e.free ? `<span class="badge free">Free</span>` : `<span class="badge paid">Paid</span>`);
  if (isEnded(e)) b.push(`<span class="badge ended">Past event · ended</span>`);
  if (!e.campus) b.push(`<span class="badge type">Off campus</span>`);
  return b.join("");
}
function where(m) {
  const x = parseFloat(m.x), y = parseFloat(m.y);
  const v = y < 34 ? "top" : y > 66 ? "bottom" : "middle", h = x < 34 ? "left" : x > 66 ? "right" : "centre";
  return v === "middle" && h === "centre" ? "centre of the map" : `${v} ${h} of the map`;
}
function mapHTML(map, small) {
  const pins = map.markers.map((m, i) => `<div class="pin" style="left:${m.x};top:${m.y}"><span class="shape s${i % 4}" style="background:${m.c}"><span>${i + 1}</span></span>${small ? "" : `<span class="tag">${esc(m.label)}</span>`}</div>`).join("");
  return `<div class="map" aria-hidden="true"><span class="road r1"></span><span class="road r2"></span><span class="road r3"></span><span class="area a1">${esc(map.labels[0])}</span><span class="area a2">${esc(map.labels[1])}</span>${pins}</div>`;
}
function placesList(map) {
  return `<ol class="places">${map.markers.map((m, i) => `<li><span class="shape s${i % 4}" style="background:${m.c}" aria-hidden="true"><span>${i + 1}</span></span><span><strong>${i + 1}. ${esc(m.label)}</strong> — ${SHAPES[i % 4]} marker, ${where(m)}</span></li>`).join("")}</ol>`;
}
function summaryHTML(count) {
  const parts = [];
  if (state.category !== "All") parts.push(`type <strong>${esc(state.category)}</strong>`);
  if (state.filter !== "all") parts.push(`<strong>${esc(filterNames[state.filter])}</strong>`);
  const on = parts.length ? `Showing ${parts.join(" and ")}. ` : "Showing all types. ";
  const reset = parts.length ? `<button class="linkbtn" data-act="reset">Show all results again</button>` : "";
  return `<p class="summary">${on}${reset}</p>`;
}
function controlsHTML() {
  return `<div class="controls">
    <div role="group" aria-labelledby="type-h"><h2 id="type-h">Result type</h2><div class="seg">
      ${categoryNames.map(c => `<button type="button" id="cat-${c}" data-cat="${c}" aria-pressed="${state.category === c}">${c}</button>`).join("")}</div></div>
    <fieldset><legend>Show</legend><div class="radios">
      ${Object.entries(filterNames).map(([v, d]) => `<label><input type="radio" name="filter" id="f-${v}" value="${v}" ${state.filter === v ? "checked" : ""}>${d}</label>`).join("")}</div></fieldset>
  </div>`;
}
function sidebarHTML() {
  let out = "";
  if (/bike|bicycle|cycling/i.test(state.query)) {
    const quad = entries.find(e => e.id === "north-quad");
    out += `<section class="card" aria-labelledby="quad-h"><p class="kicker">Campus map</p><h2 id="quad-h">North Quad cycling facilities</h2>
      ${mapHTML(quad.map, true)}${placesList(quad.map)}
      <button class="btn quiet" id="open-side-north-quad" data-open="north-quad">Open the North Quad map</button></section>`;
  }
  out += `<section class="card" aria-labelledby="rel-h"><h2 id="rel-h">Related searches</h2><ul class="chips">
    ${relatedFor(state.query).map(t => `<li><button data-q="${esc(t)}">${esc(t)}</button></li>`).join("")}</ul></section>`;
  return `<aside aria-label="More for this search">${out}</aside>`;
}

/* ---------- views ---------- */
function renderHome() {
  document.title = "Fieldnote – Search the campus index";
  main.innerHTML = `<div class="panel"><h1 id="view-title" tabindex="-1">Search the campus index</h1>
    <p>Look up campus services, events, maps, and guides. Type in the search box above and press Enter, or start from a popular search.</p>
    <h2 style="font-size:18px">Popular searches</h2><ul class="chips">${suggestions.slice(0, 5).map(t => `<li><button data-q="${esc(t)}">${esc(t)}</button></li>`).join("")}</ul></div>`;
}
function renderResults() {
  const results = filtered(), n = results.length, q = state.query;
  const title = n ? `${n} result${n === 1 ? "" : "s"} for “${q}”` : `No results for “${q}”`;
  document.title = `${title} – Fieldnote`;
  let body;
  if (!n) {
    const filtersOn = state.category !== "All" || state.filter !== "all";
    body = `<div class="panel" id="empty">
      <p>Nothing in the campus index matched ${filtersOn ? "these words with the current type and filter" : "these words"}.</p>
      ${filtersOn ? `<p><button class="btn" id="empty-reset" data-act="reset">Search again without type and filter</button></p>` : ""}
      <h2 style="font-size:18px">Try one of these</h2>
      <ul class="try"><li>Check the spelling of each word.</li><li>Use fewer or more general words, for example “bike” instead of “bike repair stand”.</li></ul>
      <p><button class="btn quiet" id="edit-search" data-act="edit">Edit your search</button></p>
      <h2 style="font-size:18px">Or search for</h2>
      <ul class="chips">${relatedFor(q).map(t => `<li><button data-q="${esc(t)}">${esc(t)}</button></li>`).join("")}</ul></div>`;
  } else {
    const pages = Math.ceil(n / pageSize), p = Math.min(state.page, pages), start = (p - 1) * pageSize;
    const items = results.slice(start, start + pageSize).map(e => `<li><p class="source">${esc(e.source)} › ${esc(e.path)}</p>
      <h2><button class="title" id="open-${e.id}" data-open="${e.id}">${esc(e.title)}</button></h2>
      <p class="desc">${esc(e.snippet)}</p><p class="meta">${badges(e)}<span>${esc(e.metadata)}</span></p></li>`).join("");
    const paging = pages > 1 ? `<nav class="pages" aria-label="Result pages"><span>Page ${p} of ${pages}:</span>${
      Array.from({ length: pages }, (_, i) => `<button id="page-${i + 1}" data-page="${i + 1}" aria-label="Page ${i + 1}" ${i + 1 === p ? 'aria-current="page"' : ""}>${i + 1}</button>`).join("")}</nav>` : "";
    body = `<ol class="results" aria-label="Search results, ${start + 1} to ${Math.min(start + pageSize, n)} of ${n}">${items}</ol>${paging}`;
  }
  main.innerHTML = `<h1 id="view-title" tabindex="-1">${esc(title)}</h1>${controlsHTML()}${summaryHTML(n)}
    <div class="layout"><div>${body}</div>${sidebarHTML()}</div>`;
}
function renderDetail() {
  const e = entries.find(x => x.id === state.item);
  document.title = `${e.title} – Fieldnote`;
  const facts = [["Source", e.source], [e.type === "Events" ? "Date and time" : "Details", e.metadata]];
  if (e.type === "Events") facts.push(["Cost", e.free ? "Free" : "Paid"]);
  facts.push(["Location", e.campus ? "On campus" : "Off campus"]);
  main.innerHTML = `<div class="panel">
    <p><button class="linkbtn" id="back" data-act="back">‹ Back to results for “${esc(state.query)}”</button></p>
    <p class="kicker">${esc(e.type.replace(/s$/, ""))}</p>
    <h1 id="view-title" tabindex="-1">${esc(e.title)}</h1>
    <p class="meta">${badges(e)}</p>
    <dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
    <p>${esc(e.body)}</p>
    ${e.map ? `<figure style="margin:0"><figcaption class="kicker">Map: ${esc(e.map.labels[0])}. Every marker is numbered and named; the list below the map describes each one.</figcaption>${mapHTML(e.map, false)}</figure>
      <h2 style="font-size:18px;margin-top:16px">Places on this map</h2>${placesList(e.map)}` : ""}
  </div>`;
}
function render() {
  closeSuggest();
  if (state.view === "home") { queryField.value = ""; renderHome(); }
  else { queryField.value = state.query; state.view === "detail" ? renderDetail() : renderResults(); }
  syncClear();
  $("skip").textContent = state.view === "results" ? "Skip to results" : "Skip to main content";
}

const countMsg = label => { const n = filtered().length; return `${label}: ${n} result${n === 1 ? "" : "s"}`; };

/* ---------- one handler for every control in the page ---------- */
main.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.q) runSearch(t.dataset.q);
  else if (t.dataset.open) go({ view: "detail", item: t.dataset.open, returnTo: t.id });
  else if (t.dataset.cat) go({ category: t.dataset.cat, page: 1 }, "cat-" + t.dataset.cat, () => countMsg(t.dataset.cat));
  else if (t.dataset.page) go({ page: +t.dataset.page }, null, `Page ${t.dataset.page}`);
  else if (t.dataset.act === "reset") go({ category: "All", filter: "all", page: 1 });
  else if (t.dataset.act === "edit") { queryField.focus(); queryField.select(); }
  else if (t.dataset.act === "back") go({ view: "results", item: "" }, state.returnTo, "Back to results");
});
/* Enter on a radio choice selects it too (radios natively only respond to arrows and Space) */
main.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.name === "filter" && !ev.target.checked) {
    ev.preventDefault(); ev.target.checked = true; ev.target.dispatchEvent(new Event("change", { bubbles: true }));
  }
});
main.addEventListener("change", ev => {
  if (ev.target.name !== "filter") return;
  const v = ev.target.value;
  go({ filter: v, page: 1 }, "f-" + v, () => countMsg(filterNames[v]));
});

render();
}
</script>
